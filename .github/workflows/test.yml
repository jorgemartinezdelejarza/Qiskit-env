name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz 2>/dev/null || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Installation
      run: |
        python -c "import qiskit; print(f'✓ Qiskit {qiskit.__version__}')"
        python -c "import numpy; print(f'✓ NumPy {numpy.__version__}')"
        python -c "import matplotlib; print('✓ Matplotlib')"
        python -c "import scipy; print('✓ SciPy')"
        python -c "import jupyterlab; print('✓ JupyterLab')"
        python -c "from IPython.kernel import kernelspec; print('✓ IPython kernel')"
        python -c "import ipywidgets; print('✓ IPyWidgets')"
        echo "✓ All essential packages installed successfully!"
